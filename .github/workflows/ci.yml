name: NoteVault CI

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies from bun.lock
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run lint

      - name: API regression tests
        run: bun test tests/api-validation.test.ts

      - name: Production build
        run: bun run build
