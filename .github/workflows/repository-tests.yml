name: Repository Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: oven-sh/setup-bun@v2
      - name: Java tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then mvn --batch-mode test
          elif [ -x ./gradlew ]; then ./gradlew test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "::error::Gradle build file exists but Gradle wrapper is missing."
            exit 1
          else
            echo "No root Java build manifest; Java tests not applicable."
          fi
      - name: Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -d tests ] || find . -maxdepth 2 -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            pytest -q
          else
            echo "No Python tests found; Python tests not applicable."
          fi
      - name: Node tests and build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No root package.json; Node tests not applicable."
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
            pnpm run lint --if-present
            pnpm test --if-present
            pnpm run build --if-present
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
            bun run lint --if-present
            bun run test --if-present
            bun run build --if-present
          elif [ -f package-lock.json ]; then
            npm ci
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          else
            npm install --no-audit --no-fund
            npm run lint --if-present
            npm test --if-present
            npm run build --if-present
          fi
