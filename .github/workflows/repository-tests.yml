name: Repository Tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: oven-sh/setup-bun@v2
      - name: Java tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pom.xml ]; then mvn --batch-mode test
          elif [ -x ./gradlew ]; then ./gradlew test
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "::error::Gradle build file exists but Gradle wrapper is missing."
            exit 1
          else
            echo "No root Java build manifest; Java tests not applicable."
          fi
      - name: Python tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            pytest -q
          else
            echo "No Python test files found; Python tests not applicable."
          fi
      - name: Node tests and build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "No root package.json; Node tests not applicable."
            exit 0
          fi
          if [ -f pnpm-lock.yaml ]; then
            PM=pnpm
            pnpm install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then
            PM=bun
            bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            PM=npm
            npm ci
          else
            PM=pnpm
            pnpm install --no-frozen-lockfile
          fi
          run_if_defined() {
            local script="$1"
            if node -e "process.exit(require('./package.json').scripts?.[process.argv[1]] ? 0 : 1)" "$script"; then
              "$PM" run "$script"
            elif [ "$script" = "test" ]; then
              echo "::warning::No test script is defined in package.json."
            fi
          }
          run_if_defined lint
          run_if_defined test
          run_if_defined build
